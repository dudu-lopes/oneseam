name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (critical checks)
        run: python -m ruff check --select F821,F822,F823 oneseam.py oneseam_simple_cli.py oneseam_blind_matching.py tests

      - name: Run CLI-focused tests
        run: python -m pytest tests/test_simple_cli_dispatch.py tests/test_simple_cli_module.py
