# Oneseam Enterprise Configuration
# Version: 2.0

# Node settings
node_port: 5001
broadcast_port: 5002
api_port: 8000
api_bind: "127.0.0.1"
storage_dir: oneseam_storage
db_backend: "sqlite"   # sqlite | postgres
db_path: "oneseam.db"
db_dsn: ""             # postgres DSN if backend=postgres

# Quorum: k-of-n shards required for reconstruction
quorum_k: 2
quorum_n: 3

# Transport mode: ON_GRID | OFF_GRID | HYBRID
# - ON_GRID: Traditional internet
# - OFF_GRID: Mesh networks (BATMAN, OLSR)
# - HYBRID: Both
transport_mode: HYBRID

# Data sovereignty (GDPR, LGPD compliance)
region: ""
country_code: ""

# Blind Relay (Repasse Cego)
blind_relay_enabled: true
max_relay_hops: 10
served_destinations: []  # ex: [BANK_ALPHA, BANK_BETA]
blind_relay_flood: false  # Flood to all neighbors for max resilience

# Bootstrap / NAT
seed_nodes: []  # ex: ["1.2.3.4:5001", "seed.example.com:5001"]
upnp_enabled: false

# Security (REST API)
tls_enabled: false
tls_cert_path: ""
tls_key_path: ""
mtls_ca_path: ""
mtls_allowed_cns: []  # Optional allowlist of client CNs

jwt_issuer: ""
jwt_audience: ""
jwt_public_keys: []  # List of PEM strings or file paths
jwt_algorithms: ["RS256", "ES256"]
allow_legacy_api_keys: true
api_max_payload_bytes: 1048576
rate_limit_rps: 5
rate_limit_burst: 10
idempotency_ttl_seconds: 300
idempotency_max_entries: 10000

# Security (P2P)
p2p_tls_enabled: false
p2p_tls_cert_path: ""
p2p_tls_key_path: ""
p2p_mtls_ca_path: ""
p2p_mtls_allowed_cns: []
p2p_mtls_required: true
p2p_retries: 3
p2p_backoff_base: 0.2

# Shard signing
shard_signature_required: true
shard_signing_private_key: "shard_signing_priv.pem"
shard_signing_public_key: "shard_signing_pub.pem"
trusted_node_pubkeys: {}  # {NODE_ID: "-----BEGIN PUBLIC KEY-----..."}

# Key management
key_store_path: "oneseam_keys.json"
signing_key_id: "node_signing"

# Observability
log_file: ""         # empty = stdout
log_json: true
log_level: "INFO"    # DEBUG | INFO | WARN | ERROR
neighbor_ttl_seconds: 60
metrics_enabled: true
