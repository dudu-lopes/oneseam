# ONESEAM Production Example Configuration
# Copy this file to oneseam_config.yaml and adjust values for your environment.

# Runtime
production_mode: true
darkpool_enabled: true
legacy_otc_api_enabled: false

# Network
node_port: 5001
broadcast_port: 5002
api_port: 8000
api_bind: "0.0.0.0"
seed_nodes: ["seed-a.example.com:5001", "seed-b.example.com:5001"]

# Storage
db_backend: "postgres"  # sqlite | postgres
db_dsn: "postgresql://oneseam_user:change_me@db-host:5432/oneseam"
db_path: "oneseam.db"

# REST security
tls_enabled: true
tls_cert_path: "certs/rest/server.crt"
tls_key_path: "certs/rest/server.key"
mtls_ca_path: "certs/rest/ca.crt"
allow_legacy_api_keys: false
jwt_issuer: "oneseam"
jwt_audience: "oneseam-api"
jwt_public_keys:
  - "certs/jwt/jwt_pub.pem"

# P2P security
p2p_tls_enabled: true
p2p_tls_cert_path: "certs/p2p/server.crt"
p2p_tls_key_path: "certs/p2p/server.key"
p2p_mtls_required: true
p2p_mtls_ca_path: "certs/p2p/ca.crt"
p2p_mtls_allowed_cns: []

# DarkPool risk controls
wallet_attestation_required: true
proof_wallet_attestation_required: true
proof_server_side_verification_required: true
proof_verifier_url: "https://proof-verifier.internal/api/v1/verify"
proof_verifier_auth_token: "CHANGE_ME"
proof_verifier_timeout_seconds: 8

# Optional BTC direct verifier for BTC-side proofs
btc_rpc_url: "http://127.0.0.1:8332"
btc_rpc_user: "bitcoinrpc"
btc_rpc_password: "CHANGE_ME"
btc_rpc_timeout_seconds: 8

# Trade policy
intent_min_expiration_seconds: 30
intent_max_expiration_seconds: 86400
intent_max_notional: 10000000
counterparty_allowlist: {}
htlc_chain_a: "BTC"
htlc_chain_b: "LIGHTNING"
htlc_min_confirmations: 2
htlc_timeout_lock_a_seconds: 7200
htlc_timeout_lock_b_seconds: 3600
swap_timeout_sweep_interval_seconds: 5
swap_enforce_side_proofs: true
fee_bps: 1
fee_lightning_endpoint: "https://ln-fee.internal/api/v1/invoice"

# Ops
log_json: true
log_level: "INFO"
metrics_enabled: true
